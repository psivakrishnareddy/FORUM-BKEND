<configuration>
   <dsncollection>
      <dsn alias="certappDB" name="DBNAME" host="DB_HOSTNAME" port="DB_PORT"/>
   </dsncollection>
   <databases>
      <database name="DBNAME" host="DB_HOSTNAME" port="DB_PORT">
         <parameter name="userid" value="DB_USERNAME"/>
         <parameter name="password" value="DB_PASSWORD"/>
         <parameter name="CurrentSchema" value="DB_SCHEMA"/>
         <parameter name="KeepAliveTimeout" value="2"/>
         <parameter name="TcpipConnectTimeout" value="2"/>
         <parameter name="ConnectionTimeout" value="8"/>
         <parameter name="MemberConnectTimeout" value="2"/>
         <acr>
          <parameter name="enableACR" value="true"/>
          <parameter name="enableSeamlessACR" value="true"/>
          <parameter name="acrRetryInterval" value="1"/>
          <parameter name="maxAcrRetries" value="600"/>
          <parameter name="affinityFailbackInterval" value="2"/>
          <parameter name="enableAlternateServerListFirstConnect" value="true" />
          <alternateserverlist>
            <server name="S1" hostname="DB_HOSTNAME" port="DB_PORT"/>
            <server name="S2" hostname="DB_HOSTNAME" port="DB_PORT"/>
          </alternateserverlist>
          <affinitylist>
            <list name="list1" serverorder="S1,S2"/>
          </affinitylist>
         </acr>
      </database>
   </databases>
</configuration>
